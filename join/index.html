<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IkGaMee — uitnodiging</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #FFE044; color: #14202b; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    background: #fff; border: 2px solid #14202b; border-radius: 20px;
    padding: 28px 24px; max-width: 380px; width: 100%; text-align: center;
  }
  h1 { font-size: 28px; font-weight: 900; letter-spacing: .5px; }
  h1 span { color: #208AEF; }
  p { font-size: 15px; color: #3c4a56; margin-top: 12px; line-height: 1.5; }
  .btn {
    display: block; margin-top: 22px; background: #2ECC40; color: #14202b;
    font-weight: 900; font-size: 17px; text-decoration: none;
    border: 2px solid #14202b; border-radius: 999px; padding: 15px 26px;
  }
  .divider { margin: 22px 0 6px; font-size: 12px; color: #8791a0; text-transform: uppercase; letter-spacing: .5px; }
  .codebox {
    background: #faf7ef; border: 2px solid #14202b; border-radius: 12px;
    padding: 12px; margin-top: 8px; font-family: ui-monospace, monospace;
    font-size: 15px; color: #14202b; word-break: break-all;
  }
  .copy {
    margin-top: 10px; background: #fff; color: #14202b; font-weight: 800; font-size: 14px;
    border: 2px solid #14202b; border-radius: 999px; padding: 9px 18px; cursor: pointer;
  }
  .hint { font-size: 13px; color: #55606c; margin-top: 14px; line-height: 1.5; }
  .hint b { color: #14202b; }
</style>
</head>
<body>
  <div class="card">
    <h1>Ik<span>Ga</span>Mee</h1>
    <p>Je bent uitgenodigd voor een kring! Tik op de knop om IkGaMee te openen.</p>
    <a class="btn" id="openBtn" href="#">Open IkGaMee</a>

    <div class="divider">Opent de app niet?</div>
    <p class="hint">Open IkGaMee zelf, tik op <b>Mijn kring</b> en plak deze code bij <b>"Code uit een uitnodiging"</b>:</p>
    <div class="codebox" id="codeText">—</div>
    <button class="copy" id="copyBtn">Kopieer code</button>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var token = params.get('token') || '';
      var appUrl = 'kommee20://join?token=' + encodeURIComponent(token);
      var openBtn = document.getElementById('openBtn');
      var codeText = document.getElementById('codeText');
      var copyBtn = document.getElementById('copyBtn');

      openBtn.setAttribute('href', appUrl);
      codeText.textContent = token || 'geen code gevonden';

      copyBtn.addEventListener('click', function () {
        if (!token) return;
        navigator.clipboard && navigator.clipboard.writeText(token).then(function () {
          copyBtn.textContent = 'Gekopieerd ✓';
          setTimeout(function () { copyBtn.textContent = 'Kopieer code'; }, 1800);
        });
      });

      // Eén poging om de app automatisch te openen, kort na het laden. Lukt dat
      // niet (browser blokkeert het schema), dan blijft de knop + code staan.
      if (token) {
        setTimeout(function () { window.location.href = appUrl; }, 400);
      }
    })();
  </script>
</body>
</html>
